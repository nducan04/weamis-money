version: '3.8'

services:
  weamis-money-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weamis-money-app
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:xXCg2lnxRwxUEj9IN6CyA6/a8XRD6sXcm7HihKSUZ4g=
      - APP_URL=https://money.vietnh.io.vn
      - ASSET_URL=https://money.vietnh.io.vn
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=file
      - SESSION_SECURE_COOKIE=false
    volumes:
      - weamis-sqlite-data:/var/www/html/database
    networks:
      - proxy-nw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.weamis-money.rule=Host(`money.vietnh.io.vn`)"
      - "traefik.http.routers.weamis-money.entrypoints=websecure"
      - "traefik.http.routers.weamis-money.tls=true"
      - "traefik.http.routers.weamis-money.tls.certresolver=cloudflare"
      - "traefik.http.services.weamis-money.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  weamis-sqlite-data:

networks:
  proxy-nw:
    external: true
